<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Liste des étudiants</title>
  <style>
    body { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; color: #222; }
    h1 { text-align: center; font-size: 20px; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 6px; border: 1px solid #ddd; }
    th { background: #f5f7fb; text-align: left; }
    .photo { width: 60px; height: 60px; object-fit: cover; }
  </style>
</head>
<body>
  <h1>Liste des étudiants</h1>
  <table>
    <thead>
      <tr>
        <th>Photo</th>
        <th>Nom complet</th>
        <th>Matricule</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      {% for etudiant in etudiants %}
        <tr>
          <td>
            {% if etudiant.photo %}
              <img src="{{ etudiant.photo.url }}" class="photo">
            {% else %}
              -
            {% endif %}
          </td>
          <td>{{ etudiant.prenom }} {{ etudiant.nom }}</td>
          <td>{{ etudiant.matricule }}</td>
          <td>{{ etudiant.email }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
